{% set name = "gepa" %}
{% set version = "0.1.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6dd153a676ae5481764860d19286a9c0e8ddb5ef70d7f13044faf24978bdb6b8

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.1
  run:
    - python
  run_constrained:
    - litellm >=1.83.0,<1.92
    - tqdm >=4.66.1
    - cloudpickle >=3.0.0
    # --- Python < 3.14 ---
    - datasets >=2.14.6      # [py<314]
    - mlflow >=3.11.1        # [py<314]
    # --- Python >= 3.14 ---
    - datasets >=4.5.0       # [py>=314]
    - pandas >=2.3.3         # [py>=314]
    - mlflow-skinny >=3.11.1  # [py>=314]
    - wandb >=0.23.0         # [py>=314]
    - pyarrow >=22.0.0       # [py>=314]
    - pydantic >=2.12.0      # [py>=314]
    - tiktoken >=0.12.0      # [py>=314]    

# fixture 'rng' not found
{% set deselect_tests = "--deselect=tests/test_state.py::test_dynamic_validation" %}
# FileNotFoundError: [Errno 2] No such file or directory: '$SRC_DIR/tests/legacy_test_state.bin'
{% set deselect_tests = deselect_tests + " --deselect=tests/test_state.py::test_load_legacy_state" %}
# fixture 'mocked_lms' not found
{% set deselect_tests = deselect_tests + " --deselect=tests/test_state.py::test_e2e_resume_run" %}
# E   ModuleNotFoundError: No module named 'conftest'
{% set ignore_tests = " --ignore=tests/test_evaluation_cache.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_parallel_proposals.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_attach_existing_run.py" %}

test:
  source_files:
    - tests
  imports:
    - gepa
    - gepa.adapters
    - gepa.core
    - gepa.gepa_utils
    - gepa.logging
    - gepa.proposer
    - gepa.strategies
    - gepa.utils
  commands:
    # litellm 1.83.7 has requirement aiohttp==3.13.5, but you have aiohttp 3.14.3.
    # litellm 1.83.7 has requirement openai==2.30.0, but you have openai 2.49.0.
    # litellm 1.83.7 has requirement tokenizers==0.22.2, but you have tokenizers 0.23.1
    - pip check  # [py<314]
    - pytest -v tests {{ deselect_tests }} {{ ignore_tests }}
  requires:
    - pip
    - pytest
    - cloudpickle >=3.0.0
    - litellm >=1.83.0,<1.92

about:
  home: https://github.com/gepa-ai/gepa
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A framework for optimizing textual system components (AI prompts, code snippets, etc.) using LLM-based reflection and Pareto-efficient evolutionary search
  description: |
    A framework for optimizing textual system components 
    (AI prompts, code snippets, etc.) using LLM-based reflection 
    and Pareto-efficient evolutionary search
  doc_url: https://github.com/gepa-ai/gepa/blob/main/README.md
  dev_url: https://github.com/gepa-ai/gepa

extra:
  recipe-maintainers:
    - moritzwilksch
